name: Build & Release Request Builder Pro

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name for manual release (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Validate Python Syntax & JSON Templates
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Code & JSON Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax (AST Compile)
        run: |
          python -m py_compile main_gui.py
          python -m compileall core parsers ui utils

      - name: Validate All 23+ JSON Templates
        run: |
          python -c "
          import glob, json, sys
          files = glob.glob('templates/*.json')
          if not files:
              print('No template files found!')
              sys.exit(1)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  json.load(fp)
          print(f'Successfully validated {len(files)} JSON templates.')
          "

  # ---------------------------------------------------------------------------
  # JOB 2: Matrix Build (Windows, Linux, macOS)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os_name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows-x64
            sep: ";"
            ext: ".exe"
            archive_ext: "zip"
          - os: ubuntu-latest
            os_name: Linux-x64
            sep: ":"
            ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            os_name: macOS-Universal
            sep: ":"
            ext: ""
            archive_ext: "zip"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies (Tkinter / Qt / XCB)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libxcb-cursor0 libgl1-mesa-glx libxkbcommon-x11-0

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Build Standalone Binary with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "RequestBuilderPro" \
            --add-data "templates${{ matrix.sep }}templates" \
            --add-data "index.html${{ matrix.sep }}." \
            --hidden-import "core" \
            --hidden-import "parsers" \
            --hidden-import "ui" \
            --hidden-import "utils" \
            --collect-submodules "core" \
            --collect-submodules "parsers" \
            --collect-submodules "ui" \
            --collect-submodules "utils" \
            main_gui.py

      - name: Assemble Release Package & Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_pkg/RequestBuilderPro"
          Copy-Item "dist/RequestBuilderPro.exe" -Destination "release_pkg/RequestBuilderPro/"
          Copy-Item "templates" -Destination "release_pkg/RequestBuilderPro/templates" -Recurse
          Copy-Item "index.html" -Destination "release_pkg/RequestBuilderPro/"
          if (Test-Path "Launcher.bat") { Copy-Item "Launcher.bat" -Destination "release_pkg/RequestBuilderPro/" }

          $archiveName = "RequestBuilderPro-${{ matrix.os_name }}.zip"
          Compress-Archive -Path "release_pkg/RequestBuilderPro/*" -DestinationPath $archiveName
          
          # Generate SHA256
          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName" | Out-File -FilePath "$archiveName.sha256" -Encoding utf8

      - name: Assemble Release Package & Checksums (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release_pkg/RequestBuilderPro
          cp "dist/RequestBuilderPro" release_pkg/RequestBuilderPro/
          cp -r templates release_pkg/RequestBuilderPro/
          cp index.html release_pkg/RequestBuilderPro/
          chmod +x release_pkg/RequestBuilderPro/RequestBuilderPro

          if [ "${{ matrix.archive_ext }}" == "tar.gz" ]; then
            ARCHIVE_NAME="RequestBuilderPro-${{ matrix.os_name }}.tar.gz"
            tar -czvf "$ARCHIVE_NAME" -C release_pkg RequestBuilderPro
          else
            ARCHIVE_NAME="RequestBuilderPro-${{ matrix.os_name }}.zip"
            cd release_pkg && zip -r "../$ARCHIVE_NAME" RequestBuilderPro && cd ..
          fi

          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RequestBuilderPro-${{ matrix.os_name }}
          path: |
            RequestBuilderPro-${{ matrix.os_name }}.${{ matrix.archive_ext }}
            RequestBuilderPro-${{ matrix.os_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 3: Publish GitHub Release (Triggers on Tag Push or Manual Dispatch)
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate Checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "Request Builder Pro ${{ inputs.release_tag || github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### Request Builder Pro ${{ inputs.release_tag || github.ref_name }}
            
            #### Included Features & Subsystems
            - **Multi-Format Traffic Parsers:** Raw HTTP, cURL, HAR, Burp Suite, and HTTP Debugger XML.
            - **Automated Detection Engine:** Built-in JWT, Bearer Token, CSRF, OAuth, Login, and Success/Failure heuristic analyzers.
            - **23 Built-in Service & Auth Templates:** Pre-configured JSON templates included in `templates/`.
            - **Proxy & Flow Testing Engine:** Integrated proxy parser, live request tester, and code generator.

            #### Downloads & Verification
            Select the archive matching your operating system below. Verify integrity using `SHA256SUMS.txt`.
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
